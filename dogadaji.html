<html lang="hr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Peračko Blato-Događaji</title>
    <link rel="icon" href="GRB.jpeg">

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f3ec;
        }

        header {
            background: #173d32;
            color: white;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 22px;
            font-weight: bold;
        }

        .menu {
            position: relative;
        }

        .menu button {
            background: #d9b778;
            border: none;
            padding: 12px 16px;
            font-size: 20px;
            cursor: pointer;
            border-radius: 6px;
        }

        .dropdown {
            display: none;
            position: absolute;
            right: 0;
            top: 48px;
            background: white;
            min-width: 190px;
            box-shadow: 0 4px 12px #0003;
            border-radius: 6px;
            overflow: hidden;
            z-index: 10;
        }

        .dropdown a {
            display: block;
            padding: 14px;
            color: #173d32;
            text-decoration: none;
        }

        .dropdown a:hover {
            background: #e8eee9;
        }

        .menu.open .dropdown {
            display: block;
        }

        main {
            padding: 40px 20px;
            text-align: center;
        }
    </style>
</head>

<body>
<header>
    <div class="logo">PERAČKO BLATO</div>
    <h2 align="center"><i>DOGAĐAJI</i></h2>

    <div class="menu" id="menu">
        <button id="menuButton"
                aria-expanded="false"
                aria-controls="dropdown"
                aria-label="Otvori izbornik">☰</button>

        <nav class="dropdown" id="dropdown">
            <a href="index.html">Početna</a>
            <a href="o-nama.html">O našem mistu</a>
            <a href="dogadaji.html">Događaji</a>
            <a href="galerija.html">Galerija</a>
            <a href="kontakt.html">Kontakt</a>
        </nav>
    </div>
</header>

<script>
    const menu = document.getElementById("menu");
    const button = document.getElementById("menuButton");

    button.addEventListener("click", function () {
        const otvoren = menu.classList.toggle("open");
        button.setAttribute("aria-expanded", otvoren);
    });

    document.addEventListener("click", function (event) {
        if (!menu.contains(event.target)) {
            menu.classList.remove("open");
            button.setAttribute("aria-expanded", "false");
        }
    });
</script>


</body>
</html>
